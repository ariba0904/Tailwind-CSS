<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="bg-slate-950 text-white min-h-screen">

    <!-- Navbar -->
    <nav class="border-b border-slate-800 bg-slate-900">

        <div class="max-w-6xl mx-auto px-6 py-5 flex justify-between items-center">

            <h1 class="text-2xl font-bold">
                ☁️ Weather
            </h1>

            <button class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg transition">
                Search
            </button>

        </div>

    </nav>


    <!-- Main -->
    <main class="max-w-6xl mx-auto px-6 py-10">

        <!-- Search -->
        <div class="flex gap-3 mb-10">

            <input
                type="text"
                placeholder="Enter city name..."
                class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-5 py-3 outline-none focus:border-blue-500"
            >

            <button
                class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-xl font-semibold transition">
                Search
            </button>

        </div>


        <!-- Current Weather -->
        <div class="bg-gradient-to-r from-blue-900 to-slate-900 border border-slate-700 rounded-3xl p-8 mb-8">

            <div class="flex flex-col md:flex-row justify-between items-center gap-6">

                <div>

                    <p class="text-slate-400 mb-2">
                        Current Weather
                    </p>

                    <h2 class="text-4xl font-bold mb-2">
                        Chattogram
                    </h2>

                    <p class="text-slate-400">
                        Friday, September 18
                    </p>

                </div>


                <div class="text-center">

                    <div class="text-7xl mb-2">
                        ☀️
                    </div>

                    <p class="text-5xl font-bold">
                        29°C
                    </p>

                    <p class="text-slate-400 mt-2">
                        Sunny
                    </p>

                </div>

            </div>

        </div>


        <!-- Weather Information -->
        <h3 class="text-2xl font-bold mb-5">
            Today's Information
        </h3>


        <div class="grid grid-cols-2 md:grid-cols-4 gap-5">

            <!-- Card 1 -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 hover:border-blue-500 transition">

                <p class="text-slate-400 mb-3">
                    💧 Humidity
                </p>

                <h4 class="text-3xl font-bold">
                    72%
                </h4>

            </div>


            <!-- Card 2 -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 hover:border-blue-500 transition">

                <p class="text-slate-400 mb-3">
                    💨 Wind
                </p>

                <h4 class="text-3xl font-bold">
                    14 km/h
                </h4>

            </div>


            <!-- Card 3 -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 hover:border-blue-500 transition">

                <p class="text-slate-400 mb-3">
                    🌡️ Feels Like
                </p>

                <h4 class="text-3xl font-bold">
                    31°C
                </h4>

            </div>


            <!-- Card 4 -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 hover:border-blue-500 transition">

                <p class="text-slate-400 mb-3">
                    👁️ Visibility
                </p>

                <h4 class="text-3xl font-bold">
                    8 km
                </h4>

            </div>

        </div>


        <!-- Forecast -->
        <h3 class="text-2xl font-bold mt-10 mb-5">
            5-Day Forecast
        </h3>


        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-4">

            <div class="bg-slate-900 p-5 rounded-2xl text-center">
                <p class="text-slate-400">Sat</p>
                <div class="text-4xl my-3">☀️</div>
                <p class="font-bold">30°C</p>
            </div>

            <div class="bg-slate-900 p-5 rounded-2xl text-center">
                <p class="text-slate-400">Sun</p>
                <div class="text-4xl my-3">🌤️</div>
                <p class="font-bold">29°C</p>
            </div>

            <div class="bg-slate-900 p-5 rounded-2xl text-center">
                <p class="text-slate-400">Mon</p>
                <div class="text-4xl my-3">🌧️</div>
                <p class="font-bold">27°C</p>
            </div>

            <div class="bg-slate-900 p-5 rounded-2xl text-center">
                <p class="text-slate-400">Tue</p>
                <div class="text-4xl my-3">⛈️</div>
                <p class="font-bold">26°C</p>
            </div>

            <div class="bg-slate-900 p-5 rounded-2xl text-center">
                <p class="text-slate-400">Wed</p>
                <div class="text-4xl my-3">☀️</div>
                <p class="font-bold">31°C</p>
            </div>

        </div>

    </main>

</body>

</html>
```
